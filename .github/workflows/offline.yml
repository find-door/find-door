name: 오프라인 코드·문서 검사
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 순수 Python 검사 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-numpy python3-scipy python3-pil python3-yaml python3-opencv
          /usr/bin/python3 --version
      - name: Python 문법 검사
        run: /usr/bin/python3 -m compileall -q src scripts
      - name: 문서 상대 링크·앵커 검사
        run: /usr/bin/python3 scripts/check_docs.py
      - name: ROS 없이 실행 가능한 단위 검사
        env:
          PYTHONPATH: src/mapping_eval:src/mapping_semantic
        run: /usr/bin/python3 -m pytest src/mapping_eval/test src/mapping_semantic/test -q
