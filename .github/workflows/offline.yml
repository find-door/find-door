name: 오프라인 코드·문서 검사
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 순수 Python 검사 의존성 설치
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip python3-pytest python3-numpy python3-scipy python3-pil python3-yaml
          sudo /usr/bin/python3 -m pip install --no-deps --require-hashes -r .github/ci-requirements.txt
          /usr/bin/python3 --version
      - name: Python 문법 검사
        run: /usr/bin/python3 -m compileall -q src scripts
      - name: 문서 상대 링크·앵커 검사
        run: /usr/bin/python3 scripts/check_docs.py
      - name: ROS 없이 실행 가능한 단위 검사
        env:
          PYTHONPATH: src/mapping_eval:src/mapping_semantic:src/mapping_robot
        run: /usr/bin/python3 -m pytest src/mapping_eval/test src/mapping_semantic/test src/mapping_robot/test scripts/test_robot_workspace.py scripts/test_robot_recording.py -q
